name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - "Maven Build and Push Docker Image to ECR"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # 3. Verify AWS identity
      - name: Check AWS Identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # 4. Verify EKS cluster
      - name: Check EKS Cluster
        run: |
          aws eks describe-cluster \
            --name ramecs \
            --region eu-west-1 \
            --query 'cluster.status' \
            --output text

      # 5. Update kubeconfig
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region eu-west-1 \
            --name ramecs
          
          echo "Kubeconfig updated successfully"
          echo "Current context:"
          kubectl config current-context

      # 6. Verify kubectl Configuration
      - name: Verify kubectl Configuration
        run: |
          echo "Checking cluster info..."
          kubectl cluster-info
          
          echo "Checking current user..."
          kubectl config get-contexts

      # 7. Verify EKS nodes
      - name: Check EKS Nodes
        run: |
          kubectl get nodes

      # 8. Deploy application
      - name: Deploy Application
        run: |
          kubectl apply -f k8s/

      # 9. Wait for deployment
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/trainbook --timeout=180s

      # 10. Check deployment
      - name: Check Deployment
        run: |
          echo "===== Deployments ====="
          kubectl get deployments

          echo "===== Pods ====="
          kubectl get pods -o wide

          echo "===== Services ====="
          kubectl get services