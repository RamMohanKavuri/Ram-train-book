name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - "Maven Build and Push Docker Image to ECR"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # 3. Check AWS identity
      - name: Check AWS Identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

      # 4. Check EKS cluster
      - name: Check EKS Cluster
        run: |
          echo "===== EKS Cluster ====="

          aws eks describe-cluster \
            --name ramecs \
            --region eu-west-1 \
            --query 'cluster.status' \
            --output text

      # 5. Check EKS access entry
      - name: Check EKS Access Entry
        run: |
          echo "===== EKS Access Entry ====="

          aws eks list-access-entries \
            --cluster-name ramecs \
            --region eu-west-1

      # 6. Generate kubeconfig
      - name: Configure kubectl
        run: |
          echo "===== Updating kubeconfig ====="

          aws eks update-kubeconfig \
            --region eu-west-1 \
            --name ramecs

          echo "===== Current Context ====="
          kubectl config current-context

      # 7. Generate EKS authentication token
      - name: Test EKS Authentication Token
        run: |
          echo "===== Getting EKS Token ====="

          aws eks get-token \
            --cluster-name ramecs \
            --region eu-west-1 \
            --output json > /tmp/eks-token.json

          echo "EKS token generated successfully"

      # 8. Test Kubernetes connection
      - name: Test Kubernetes Connection
        run: |
          echo "===== Cluster Info ====="
          kubectl cluster-info

      # 9. Check nodes
      - name: Check EKS Nodes
        run: |
          echo "===== EKS Nodes ====="
          kubectl get nodes

      # 10. Deploy application
      - name: Deploy Application
        run: |
          echo "===== Deploying Application ====="
          kubectl apply -f k8s/

      # 11. Wait for deployment
      - name: Wait for Deployment
        run: |
          kubectl rollout status deployment/trainbook --timeout=180s

      # 12. Check deployment
      - name: Check Deployment
        run: |
          echo "===== Deployments ====="
          kubectl get deployments

          echo "===== Pods ====="
          kubectl get pods -o wide

          echo "===== Services ====="
          kubectl get services