name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - "Maven Build and Push Docker Image to ECR"
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # 3. Check AWS identity
      - name: Check AWS Identity
        run: |
          echo "===== AWS Identity ====="
          aws sts get-caller-identity

      # 4. Check EKS cluster
      - name: Check EKS Cluster
        run: |
          echo "===== EKS Cluster ====="

          aws eks describe-cluster \
            --name ramecs \
            --region eu-west-1 \
            --query 'cluster.status' \
            --output text

      # 5. Check EKS authentication mode
      - name: Check EKS Authentication Mode
        run: |
          echo "===== EKS Authentication Mode ====="

          aws eks describe-cluster \
            --name ramecs \
            --region eu-west-1 \
            --query 'cluster.accessConfig.authenticationMode' \
            --output text

      # 6. Check EKS access entries
      - name: Check EKS Access Entries
        run: |
          echo "===== EKS Access Entries ====="

          aws eks list-access-entries \
            --cluster-name ramecs \
            --region eu-west-1

      # 7. Check manio access policy
      - name: Check EKS Access Policy
        run: |
          echo "===== EKS Access Policy for manio ====="

          aws eks list-associated-access-policies \
            --cluster-name ramecs \
            --principal-arn arn:aws:iam::422261031406:user/manio \
            --region eu-west-1

      # 8. Test EKS authentication token
      - name: Test EKS Authentication Token
        run: |
          echo "===== Generating EKS Token ====="

          aws eks get-token \
            --cluster-name ramecs \
            --region eu-west-1

          echo "EKS token generated successfully"

      # 9. Configure kubeconfig
      - name: Configure kubectl
        run: |
          echo "===== Updating kubeconfig ====="

          rm -rf ~/.kube
          mkdir -p ~/.kube

          aws eks update-kubeconfig \
            --region eu-west-1 \
            --name ramecs \
            --kubeconfig ~/.kube/config

          echo "===== Current Context ====="
          kubectl config current-context

      # 10. Verify kubeconfig authentication configuration
      - name: Verify kubeconfig
        run: |
          echo "===== Kubernetes Exec Configuration ====="

          kubectl config view \
            --minify \
            --raw \
            -o jsonpath='{.users[0].user.exec.command}{"\n"}'

          kubectl config view \
            --minify \
            --raw \
            -o jsonpath='{.users[0].user.exec.args}{"\n"}'

      # 11. Test Kubernetes API
      - name: Test Kubernetes Connection
        run: |
          echo "===== Kubernetes API ====="

          kubectl get --raw=/version

      # 12. Check cluster information
      - name: Check Cluster Info
        run: |
          echo "===== Cluster Info ====="

          kubectl cluster-info

      # 13. Check EKS nodes
      - name: Check EKS Nodes
        run: |
          echo "===== EKS Nodes ====="

          kubectl get nodes

      # 14. Deploy application
      - name: Deploy Application
        run: |
          echo "===== Deploying Application ====="

          kubectl apply -f k8s/

      # 15. Wait for deployment
      - name: Wait for Deployment
        run: |
          echo "===== Waiting for Deployment ====="

          kubectl rollout status deployment/trainbook --timeout=180s

      # 16. Check deployment
      - name: Check Deployment
        run: |
          echo "===== Deployments ====="
          kubectl get deployments

          echo "===== Pods ====="
          kubectl get pods -o wide

          echo "===== Services ====="
          kubectl get services