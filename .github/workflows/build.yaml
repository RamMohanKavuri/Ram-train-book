name: Maven Build and Push Docker Image to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 3. Build Maven project
      - name: Build Project
        run: mvn clean install -DskipTests

      # 4. Verify WAR file
      - name: Verify WAR
        run: ls -lh target

      # 5. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:AKIAWEUFYAHXFAPLBXPU4
          aws-secret-access-key:a6QyW+sGLf63RTlxVZ0JkdOfLOOaEMqnusQkDNaU
          aws-region:eu-west-1

      # 6. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ecrrmk:latest .

      # 8. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag ecrrmk:latest \
          ${{ steps.login-ecr.outputs.registry }}/ecrrmk:latest

      # 9. Push Docker Image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/ecrrmk:latest