apiVersion: apps/v1
kind: Deployment
metadata:
  name: ram-train-book
  namespace: default
  labels:
    app: ram-train-book
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ram-train-book
  template:
    metadata:
      labels:
        app: ram-train-book
        version: v1
    spec:
      containers:
      - name: ram-train-book
        image: 422261031406.dkr.ecr.eu-west-1.amazonaws.com/ecrrmk:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: ENVIRONMENT
          value: "production"
